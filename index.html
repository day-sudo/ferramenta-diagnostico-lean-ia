<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferramenta de Diagnóstico Lean</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f8fafc;
  margin:0;
  padding:20px;
}

h1,h2 { color:#1e293b; }

.container {
  max-width:1200px;
  margin:auto;
}

.tabs {
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
}

.tab-btn {
  padding:10px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  color:#fff;
  font-weight:bold;
}

.active { outline:3px solid #000; }

.panel {
  background:#fff;
  padding:20px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.hidden { display:none; }

.toolbar button {
  margin:2px;
  padding:6px;
  cursor:pointer;
}

#bpmn-canvas {
  height:400px;
  border:2px dashed #ccc;
  position:relative;
}

.node {
  position:absolute;
  padding:6px 10px;
  border:2px solid #3b82f6;
  background:#fff;
  cursor:move;
  font-size:12px;
}

textarea, input, select {
  width:100%;
  padding:6px;
  margin-top:4px;
}

</style>
</head>

<body>

<div class="container">

<h1>Ferramenta de Diagnóstico Lean</h1>

<div class="tabs">
  <button class="tab-btn active" style="background:#7c3aed" onclick="switchTab('bpmn',event)">BPMN</button>
  <button class="tab-btn" style="background:#10b981" onclick="switchTab('sipoc',event)">SIPOC</button>
  <button class="tab-btn" style="background:#f59e0b" onclick="switchTab('w5h2',event)">5W2H</button>
  <button class="tab-btn" style="background:#ef4444" onclick="switchTab('ia',event)">IA</button>
</div>

<!-- BPMN -->
<div id="bpmn" class="panel">

<h2>BPMN</h2>

<div class="toolbar">
  <button onclick="setTool('task',event)">Tarefa</button>
  <button onclick="setTool('delete',event)">Excluir</button>
</div>

<div id="bpmn-canvas" onclick="canvasClick(event)"></div>

</div>

<!-- SIPOC -->
<div id="sipoc" class="panel hidden">

<h2>SIPOC</h2>

<label>Fornecedores</label>
<textarea id="sipoc-s"></textarea>

<label>Entradas</label>
<textarea id="sipoc-i"></textarea>

<label>Processo</label>
<div id="sipoc-process"></div>

<label>Saídas</label>
<textarea id="sipoc-o"></textarea>

<label>Clientes</label>
<textarea id="sipoc-c"></textarea>

</div>

<!-- 5W2H -->
<div id="w5h2" class="panel hidden">

<h2>5W2H</h2>

<select id="taskSelect" onchange="loadTask()"></select>

<input id="what" placeholder="What">
<input id="why" placeholder="Why">

</div>

<!-- IA -->
<div id="ia" class="panel hidden">

<h2>Análise Lean</h2>

<button onclick="analyze()">Rodar análise</button>

<div id="output"></div>

</div>

</div>

<script>

let nodes = [];
let tool = "task";
let id = 1;

function switchTab(tab,e){
  document.querySelectorAll(".panel").forEach(p=>p.classList.add("hidden"));
  document.getElementById(tab).classList.remove("hidden");

  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  if(e) e.target.classList.add("active");

  if(tab==="sipoc") updateSipoc();
  if(tab==="w5h2") updateSelect();
}

function setTool(t,e){
  tool = t;
}

function canvasClick(e){
  if(tool==="task"){
    const div=document.createElement("div");
    div.className="node";
    div.style.left=e.offsetX+"px";
    div.style.top=e.offsetY+"px";
    div.innerText="Tarefa "+id++;

    div.onclick=()=> {
      if(tool==="delete") div.remove();
    }

    document.getElementById("bpmn-canvas").appendChild(div);
    nodes.push(div.innerText);
  }
}

function updateSipoc(){
  const el=document.getElementById("sipoc-process");
  el.innerHTML=nodes.map(n=>"<div>"+n+"</div>").join("");
}

function updateSelect(){
  const sel=document.getElementById("taskSelect");
  sel.innerHTML="";
  nodes.forEach(n=>{
    const o=document.createElement("option");
    o.text=n;
    sel.add(o);
  });
}

function loadTask(){}

function analyze(){
  document.getElementById("output").innerHTML =
    "Análise simples: processo com "+nodes.length+" etapas.";
}

</script>

</body>
</html>
